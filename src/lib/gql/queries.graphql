query LatestTransactions($limit: Int!, $offset: Int!) {
  transactions(
    limit: $limit
    offset: $offset
    order_by: { timestamp: desc }
  ) {
    version
    hash
    sender
    success
    gas_used
    timestamp
    payload {
      type
      function
      type_arguments
      arguments
    }
    events {
      type
      data
      sequence_number
    }
    state_changes {
      type
      address
      resource
      data
    }
  }
}

