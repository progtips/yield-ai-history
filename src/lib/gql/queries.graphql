query AccountTransactions($address: String!, $limit: Int!, $offset: Int!) {
  transactions(
    where: { sender: { _eq: $address } }
    limit: $limit
    offset: $offset
    order_by: { timestamp: desc }
  ) {
    version
    hash
    sender
    success
    gas_used
    timestamp
    payload {
      type
      function
      type_arguments
      arguments
    }
  }
}

query FungibleAssetBalances($address: String!) {
  current_fungible_asset_balances(
    where: { owner_address: { _eq: $address } }
  ) {
    amount
    asset_type
    metadata {
      name
      symbol
      decimals
      icon_uri
    }
  }
}
